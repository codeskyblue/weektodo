<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<style>
			* { box-sizing: border-box; }
			html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
			body { display: flex; align-items: center; justify-content: center; }
			img { display: block; height: 1920px; width: auto; }
		</style>
	</head>
	<body>
		<img id="shot" alt="WeekTodo 截图" />
		<script>
			const params = new URLSearchParams(location.search);
			const shot = params.get('shot') || '1-home';
			document.getElementById('shot').src = `../screenshots/iphone-6.9-${shot}.png`;
		</script>
	</body>
</html>
