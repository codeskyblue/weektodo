<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<style>
			* { box-sizing: border-box; }
			html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB',
					'Microsoft YaHei', sans-serif;
				background:
					radial-gradient(circle at 50% 18%, rgba(52, 211, 153, 0.18), transparent 34%),
					radial-gradient(circle at 15% 80%, rgba(16, 185, 129, 0.12), transparent 30%),
					linear-gradient(155deg, #27272a 0%, #18181b 45%, #09090b 100%);
				color: #fafafa;
			}
			.brand { position: absolute; top: 58px; left: 0; right: 0; text-align: center; }
			.icon {
				width: 118px;
				height: 118px;
				border-radius: 26px;
				box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
			}
			.name { margin-top: 20px; font-size: 64px; line-height: 1; font-weight: 750; letter-spacing: -1px; }
			.tagline { margin-top: 12px; font-size: 30px; color: #a1a1aa; letter-spacing: 1px; }
			.phone {
				position: absolute;
				left: 50%;
				top: 318px;
				width: 646px;
				height: 1404px;
				transform: translateX(-50%);
				border-radius: 54px;
				overflow: hidden;
				border: 10px solid #3f3f46;
				background: #fff;
				box-shadow:
					0 50px 120px rgba(0, 0, 0, 0.65),
					0 0 0 1px rgba(255, 255, 255, 0.08);
			}
			.phone img { width: 100%; height: 100%; object-fit: cover; display: block; }
			.caption { position: absolute; left: 40px; right: 40px; bottom: 62px; text-align: center; }
			.caption h1 { margin: 0; font-size: 46px; line-height: 1.2; font-weight: 700; }
			.caption p { margin: 12px 0 0; font-size: 27px; color: #a1a1aa; }
			.dot { color: #34d399; }
		</style>
	</head>
	<body>
		<div class="brand">
			<img class="icon" src="icon-1024.png" alt="WeekTodo" />
			<div class="name">WeekTodo</div>
			<div class="tagline">周计划 · 离线优先</div>
		</div>
		<div class="phone"><img id="shot" alt="WeekTodo 截图" /></div>
		<div class="caption">
			<h1 id="caption"></h1>
			<p id="sub"></p>
		</div>
		<script>
			const params = new URLSearchParams(location.search);
			const shot = params.get('shot') || '1-home';
			const captions = {
				home: ['以周为单位，专注本周', '离线任务管理 · 无需注册'],
				weeks: ['1 / 2 / 3 周视图', '一眼看清本周、上周和下周'],
				report: ['周报一键生成', '完成、废弃、未完成自动汇总'],
				settings: ['分类 · 外观 · 语言', '深浅色主题，中英文界面']
			};
			const data = captions[shot.split('-').slice(1).join('-')] || captions.home;
			document.getElementById('shot').src = `../screenshots/iphone-6.9-${shot}.png`;
			document.getElementById('caption').textContent = params.get('title') || data[0];
			document.getElementById('sub').textContent = params.get('sub') || data[1];
		</script>
	</body>
</html>
